openapi: 3.0.3
info:
  title: TeamUp API
  description: |
    Sports venue booking and team formation API

    Features:
    - Venue search with geolocation
    - Timeslot booking
    - TeamUp creation and management
    - Join request workflow
  version: 1.0.0
  contact:
    name: TeamUp API Support
servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api.teamup.example.com
    description: Production server

tags:
  - name: Health
    description: Health check endpoints
  - name: Auth
    description: Authentication and user management
  - name: Venues
    description: Venue and timeslot search
  - name: Bookings
    description: Booking management
  - name: TeamUps
    description: TeamUp creation and management
  - name: Chat
    description: AI Assistant chat messaging

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  # ============================================================================
  # AUTH ROUTES
  # ============================================================================
  /auth/signup:
    post:
      tags: [Auth]
      summary: Sign up new user
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupIn'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '409':
          description: Email already exists

  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '401':
          description: Invalid credentials

  /auth/delete_account: 
    delete:
      tags: [Auth]
      summary: Delete account
      operationId: deleteAccount
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Unauthorized

  /auth/update_password:
    post:
      tags: [Auth]
      summary: Update password
      operationId: updatePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Invalid input or old password incorrect
        '401':
          description: Unauthorized
  
  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user info
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '401':
          description: Unauthorized
  # ============================================================================
  # VENUE ROUTES
  # ============================================================================
  /venues:
    get:
      tags: [Venues]
      summary: Search venues with available time slots
      description: |
        Search venues based on location, datetime, and sport type.
        Supports geolocation-based search with distance filtering.
      operationId: searchVenues
      parameters:
        - name: lat
          in: query
          description: Latitude coordinate
          schema:
            type: number
            format: float
            example: 25.0330
        - name: lng
          in: query
          description: Longitude coordinate
          schema:
            type: number
            format: float
            example: 121.5654
        - name: distance
          in: query
          description: Search radius in meters (default 5000m)
          schema:
            type: number
            format: float
            default: 5000
            example: 5000
        - name: datetime
          in: query
          description: ISO datetime (YYYY-MM-DDTHH:MM:SS) or date (YYYY-MM-DD)
          schema:
            type: string
            example: "2025-10-20"
        - name: sport_type
          in: query
          description: Filter by sport type
          schema:
            type: string
            example: basketball
        - name: require_bookable
          in: query
          description: Only return venues with bookable time slots (default false)
          schema:
            type: boolean
            default: false
            example: false
      responses:
        '200':
          description: List of venues with available time slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VenueSearchResult'

    post:
      tags: [Venues]
      summary: Create venue
      operationId: createVenue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueCreateIn'
      responses:
        '201':
          description: Venue created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueDetail'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized

  /venues/{venue_id}:
    get:
      tags: [Venues]
      summary: Get venue details
      operationId: getVenueById
      parameters:
        - name: venue_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Venue details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueDetail'
        '404':
          description: Venue not found
    put:
      tags: [Venues]
      summary: Update venue
      operationId: updateVenue
      security:
        - bearerAuth: []
      parameters:
        - name: venue_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueUpdateIn'
      responses:
        '200':
          description: Venue updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueDetail'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Venue not found
    delete:
      tags: [Venues]
      summary: Delete venue
      operationId: deleteVenue
      security:
        - bearerAuth: []
      parameters:
        - name: venue_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Venue deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Venue not found

  # crud court
  /venues/{venue_id}/courts/{court_id}:
    # get court detail
    get:
      tags: [Venues]
      summary: Get court detail
      operationId: getCourt
      parameters:
        - name: venue_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: court_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Court detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourtOut'
    put:
      tags: [Venues]
      summary: Update court
      operationId: updateCourt
      security:
        - bearerAuth: []
      parameters:
        - name: venue_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: court_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourtUpdateIn'
      responses:
        '200':
          description: Court updated
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/CourtOut'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Venue or court not found
    delete:
      tags: [Venues]
      summary: Delete court
      operationId: deleteCourt
      security:
        - bearerAuth: []
      parameters:
        - name: venue_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: court_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Court deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Venue or court not found

  /venues/{venue_id}/courts/{court_id}/time_slots:
    get:
      tags: [Venues]
      summary: Get available time slots for a court
      operationId: getCourtTimeSlots
      parameters:
        - name: venue_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: court_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          description: Filter by date (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2025-10-20"
      responses:
        '200':
          description: List of available time slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeSlotOut'
        '404':
          description: Venue or court not found
    
    post:
      tags: [Venues]
      summary: Create new timeslot(s)
      operationId: createTimeSlot
      security:
        - bearerAuth: []
      parameters:
        - name: venue_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: court_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeSlotCreateIn'
      responses:
        '201':
          description: Time slot created
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/TimeSlotOut'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Venue or court not found
  
  /venues/{venue_id}/courts/{court_id}/time_slots/{time_slot_id}:
    get:
      tags: [Venues]
      summary: Get timeslot details
      operationId: getTimeSlot
      parameters:
        - name: venue_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: court_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: time_slot_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Time slot details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSlotOut'
        '404':
          description: Time slot not found
    put:
      tags: [Venues]
      summary: Update timeslot
      operationId: updateTimeSlot
      security:
        - bearerAuth: []
      parameters:
        - name: venue_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: court_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: time_slot_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeSlotUpdateIn'
      responses:
        '200':
          description: Time slot updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSlotOut'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Time slot not found
    delete:
      tags: [Venues]
      summary: Delete timeslot
      operationId: deleteTimeSlot
      security:
        - bearerAuth: []
      parameters:
        - name: venue_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: court_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: time_slot_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Time slot deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Time slot not found

  # ============================================================================
  # BOOKING ROUTES
  # ============================================================================
  /bookings:
    get:
      tags: [Bookings]
      summary: List user's bookings
      operationId: listBookings
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, cancelled]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingOut'
        '401':
          description: Unauthorized

    post:
      tags: [Bookings]
      summary: Create a new booking
      operationId: createBooking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateIn'
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingOut'
        '400':
          description: Invalid timeslot or already booked
        '401':
          description: Unauthorized
        '404':
          description: Timeslot not found

  /bookings/{booking_id}:
    get:
      tags: [Bookings]
      summary: Get booking details
      operationId: getBookingById
      security:
        - bearerAuth: []
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Booking details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetailOut'
        '403':
          description: Not the booking owner
        '404':
          description: Booking not found

    put:
      tags: [Bookings]
      summary: Update booking fully (admin)
      operationId: updateBookingFully
      security:
        - bearerAuth: []
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingUpdateIn'
      responses:
        '200':
          description: Booking updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingOut'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Booking not found

    patch:
      tags: [Bookings]
      summary: Update booking status
      operationId: updateBooking
      security:
        - bearerAuth: []
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingUpdateIn'
      responses:
        '200':
          description: Booking updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingOut'
        '403':
          description: Not the booking owner
        '404':
          description: Booking not found

    delete:
      tags: [Bookings]
      summary: Cancel booking
      operationId: cancelBooking
      security:
        - bearerAuth: []
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Booking cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        '403':
          description: Not the booking owner
        '404':
          description: Booking not found

  # ============================================================================
  # EVENT ROUTES
  # ============================================================================
  /events:
    get:
      tags: [Events]
      summary: List and search Events
      description: |
        List Events with optional filtering and search.
        Supports filtering by status, visibility, and keyword search on title.
      operationId: listEvents
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: status
          in: query
          description: Filter by event status
          schema:
            type: string
            enum: [open, closed]
            default: open
        - name: visibility
          in: query
          description: Filter by visibility
          schema:
            type: string
            enum: [public, private]
        - name: keyword
          in: query
          description: Search keyword (searches in title)
          schema:
            type: string
        - name: datetime_after
          in: query
          description: Filter events that have time slots starting after this datetime
          schema:
            type: string
            format: date-time
        - name: division
          in: query
          description: Filter events by venue city/division
          schema:
            type: string
        - name: category
          in: query
          description: Filter events by sport category
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventOut'

    post:
      tags: [Events]
      summary: Create a new Event
      operationId: createEvent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateIn'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOut'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized

  /events/{event_id}:
    get:
      tags: [Events]
      summary: Get Event details
      operationId: getEventById
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetailOut'
        '404':
          description: Event not found
    put:
      tags: [Events]
      summary: Update Event
      operationId: updateEvent
      security:
        - bearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdateIn'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetailOut'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Event not found
    delete:
      tags: [Events]
      summary: Delete Event
      operationId: deleteEvent
      security:
        - bearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Event not found

  /events/{event_id}/book:
    post:
      tags: [Events]
      summary: Book a timeslot for Event (owner only)
      description: Event owner can book multiple time slots for the team
      operationId: bookTimeslotForEvent
      security:
        - bearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBookTimeSlotIn'
      responses:
        '201':
          description: Timeslot booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBookingResponse'
        '400':
          description: Invalid timeslot or already booked
        '403':
          description: Not the Event owner
        '404':
          description: Event or timeslot not found

  /events/{event_id}/bookings:
    get:
      tags: [Events]
      summary: List all bookings for a Event
      operationId: listEventBookings
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of Event bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventBookingDetail'
        '404':
          description: Event not found

  /events/{event_id}/join:
    post:
      tags: [Events]
      summary: Submit join request to Event
      description: |
        Submit a join request to join a Event.
        Authenticated users auto-fill their info, non-authenticated users must provide details.
      operationId: joinEvent
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequestCreateIn'
      responses:
        '201':
          description: Join request submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestSubmitResponse'
        '400':
          description: Event not open / Already applied / Event full
        '404':
          description: Event not found

  /events/{event_id}/join-requests:
    get:
      tags: [Events]
      summary: List join requests (owner only)
      operationId: listJoinRequests
      security:
        - bearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of join requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JoinRequestOut'
        '403':
          description: Not the Event owner
        '404':
          description: Event not found

  /events/{event_id}/join-requests/{request_id}/review:
    post:
      tags: [Events]
      summary: Review join request (owner only)
      description: Approve or reject a join request
      operationId: reviewJoinRequest
      security:
        - bearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: request_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequestReviewIn'
      responses:
