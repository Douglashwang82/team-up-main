openapi: 3.0.3
info:
  title: Sports Meetup API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /auth/signup:
    post:
      tags: [Auth]
      summary: Sign up
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupIn'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '409':
          description: Email taken

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '401':
          description: Invalid credentials

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user info
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, email, display_name]
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  display_name:
                    type: string
                    nullable: true
        '401':
          description: Unauthorized
    patch:
      tags: [Auth]
      summary: Update current user info
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  nullable: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, email, display_name]
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  display_name:
                    type: string
                    nullable: true
        '401':
          description: Unauthorized

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '401':
          description: Invalid token

  /venues/search:
    get:
      tags: [Venues]
      summary: Search available venues and timeslots (可搜尋公開活動)
      operationId: searchVenues
      parameters:
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: date
          schema: { type: string, format: date }
        - in: query
          name: sport_type
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [venue, timeslots]
                  properties:
                    venue:
                      type: object
                      required: [id, name, address, lat, lng]
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        address:
                          type: string
                        lat:
                          type: number
                        lng:
                          type: number
                    timeslots:
                      type: array
                      items:
                        type: object
                        required: [id, start_time, end_time, price, is_bookable]
                        properties:
                          id:
                            type: string
                            format: uuid
                          start_time:
                            type: string
                            format: date-time
                          end_time:
                            type: string
                            format: date-time
                          price:
                            type: number
                          is_bookable:
                            type: boolean
        '400':
          description: city_date_required

  /bookings:
    get:
      tags: [Bookings]
      summary: List user's bookings
      operationId: listUserBookings
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema: 
            type: string
            enum: [pending, confirmed, cancelled]
        - in: query
          name: limit
          schema: 
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema: 
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingOut'
        '401':
          description: Unauthorized

  /bookings/{id}:
    get:
      tags: [Bookings]
      summary: Get booking details
      operationId: getBooking
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
        '404':
          description: Booking not found
        '403':
          description: Not the owner

  /teamups:
    get:
      tags: [TeamUps]
      summary: List teamups with filters (all visibility)
      operationId: listTeamups
      parameters:
        - in: query
          name: sport_type
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: status
          schema:
            type: string
            enum: [open, closed, confirmed, cancelled]
            default: open
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamUpListItem'

  /teamups/public:
    get:
      tags: [TeamUps]
      summary: Get public teamups (可搜尋公開組團)
      operationId: getPublicTeamups
      parameters:
        - in: query
          name: sport_type
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: status
          schema:
            type: string
            enum: [open, closed, confirmed, cancelled]
            default: open
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamUpListItem'
    post:
      tags: [TeamUps]
      summary: Create a new teamup
      operationId: createTeamup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpCreateIn'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamUpCreateResponse'
        '400':
          description: Invalid input / TeamUp already exists for timeslot
        '401':
          description: Unauthorized
        '404':
          description: Court timeslot not found

  /teamups/{id}:
    get:
      tags: [TeamUps]
      summary: Get teamup details
      operationId: getTeamup
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamUpDetail'
        '404':
          description: TeamUp not found

  /teamups/token/{invite_token}:
    get:
      tags: [TeamUps]
      summary: Get invite-only teamup by token (憑 token 讀取 invite-only 組團資訊)
      operationId: getInviteOnlyTeamup
      parameters:
        - in: path
          name: invite_token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamUpDetail'
        '404':
          description: TeamUp not found

  /teamups/{id}/join:
    post:
      tags: [TeamUps]
      summary: Join a teamup
      operationId: joinTeamup
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpJoinRequest'
      responses:
        '201':
          description: Join request submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamUpJoinResponse'
        '400':
          description: TeamUp not open / Already applied / Already joined / TeamUp full
        '404':
          description: TeamUp not found

  /teamups/{id}/join-requests:
    get:
      tags: [TeamUps]
      summary: List join requests for a teamup (owner only)
      operationId: listTeamupJoinRequests
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamUpJoinRequestDetail'
        '403':
          description: Not the owner
        '404':
          description: TeamUp not found

  /teamups/{id}/join-requests/{request_id}/review:
    post:
      tags: [TeamUps]
      summary: Review a join request (owner only)
      operationId: reviewTeamupJoinRequest
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: request_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpReviewRequest'
      responses:
        '200':
          description: Review completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamUpReviewResponse'
        '400':
          description: Invalid action / Already reviewed / TeamUp full
        '403':
          description: Not the owner
        '404':
          description: TeamUp or request not found

  /teamups/{id}/book:
    post:
      tags: [TeamUps]
      summary: Book a timeslot for a TeamUp (owner only, can book multiple)
      operationId: bookTimeslotForTeamup
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timeslot_id]
              properties:
                timeslot_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingOut'
        '400':
          description: Invalid timeslot / Timeslot already booked / Timeslot not bookable
        '403':
          description: Not the owner
        '404':
          description: TeamUp or timeslot not found

  /teamups/{id}/bookings:
    get:
      tags: [TeamUps]
      summary: List all bookings for a TeamUp
      operationId: listTeamupBookings
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamUpBookingDetail'
        '404':
          description: TeamUp not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Tokens:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }

    SignupIn:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
        display_name: { type: string, nullable: true }

    LoginIn:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    TeamUpCreateIn:
      type: object
      required: [title, min_participants, max_participants]
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        min_participants:
          type: integer
          minimum: 1
        max_participants:
          type: integer
          minimum: 1
        deadline:
          type: string
          format: date-time
          nullable: true
        sport_type:
          type: string
          nullable: true
        visibility:
          type: string
          enum: [public, invite_only, private]
          default: public

    TeamUpCreateResponse:
      type: object
      required: [id, title, status, min_participants, max_participants, current_participants, visibility]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [open, closed, confirmed, cancelled]
        min_participants:
          type: integer
        max_participants:
          type: integer
        current_participants:
          type: integer
        visibility:
          type: string
          enum: [public, invite_only, private]

    TeamUpListItem:
      type: object
      required: [id, title, status, min_participants, max_participants, current_participants, court_name, venue_name, starts_at, ends_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        sport_type:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, closed, confirmed, cancelled]
        visibility:
          type: string
          enum: [public, invite_only, private]
        invite_token:
          type: string
          nullable: true
        min_participants:
          type: integer
        max_participants:
          type: integer
        current_participants:
          type: integer
        deadline:
          type: string
          format: date-time
          nullable: true
        court_name:
          type: string
        venue_name:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    TeamUpDetail:
      type: object
      required: [id, title, status, min_participants, max_participants, current_participants, owner_user_id, participants, bookings, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        sport_type:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, closed, confirmed, cancelled]
        visibility:
          type: string
          enum: [public, invite_only, private]
        invite_token:
          type: string
          nullable: true
        min_participants:
          type: integer
        max_participants:
          type: integer
        current_participants:
          type: integer
        deadline:
          type: string
          format: date-time
          nullable: true
        owner_user_id:
          type: string
          format: uuid
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/TeamUpBookingDetail'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/TeamUpParticipant'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TeamUpParticipant:
      type: object
      required: [id, display_name, role, joined_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        display_name:
          type: string
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, member]
        joined_at:
          type: string
          format: date-time

    TeamUpJoinRequest:
      type: object
      properties:
        applicant_name:
          type: string
        applicant_email:
          type: string
          format: email
        applicant_phone:
          type: string
          nullable: true
        message:
          type: string
          nullable: true

    TeamUpJoinResponse:
      type: object
      required: [id, status, message]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [submitted, approved, rejected]
        message:
          type: string

    TeamUpJoinRequestDetail:
      type: object
      required: [id, applicant_name, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        applicant_user_id:
          type: string
          format: uuid
          nullable: true
        applicant_name:
          type: string
        applicant_email:
          type: string
          nullable: true
        applicant_phone:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        status:
          type: string
          enum: [submitted, approved, rejected]
        created_at:
          type: string
          format: date-time
        reviewed_at:
          type: string
          format: date-time
          nullable: true

    TeamUpReviewRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject]

    TeamUpReviewResponse:
      type: object
      required: [ok, status, message]
      properties:
        ok:
          type: boolean
        status:
          type: string
          enum: [approved, rejected]
        message:
          type: string

    TeamUpBookingDetail:
      type: object
      required: [id, status, payment_status, timeslot, court, venue, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        payment_status:
          type: string
          enum: [none, pending, succeeded, failed]
        timeslot:
          type: object
          required: [id, starts_at, ends_at, price_cents, currency]
          properties:
            id:
              type: string
              format: uuid
            starts_at:
              type: string
              format: date-time
            ends_at:
              type: string
              format: date-time
            price_cents:
              type: integer
              nullable: true
            currency:
              type: string
        court:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            sport_type:
              type: string
              nullable: true
        venue:
          type: object
          required: [id, name, address]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            address:
              type: string
            city:
              type: string
              nullable: true
        created_at:
          type: string
          format: date-time

    BookingOut:
      type: object
      required: [id, owner_user_id, timeslot_id, status, payment_status, created_at]
      properties:
        id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
        timeslot_id:
          type: string
          format: uuid
        teamup_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        payment_status:
          type: string
          enum: [none, pending, succeeded, failed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BookingDetail:
      type: object
      required: [id, owner_user_id, timeslot_id, status, payment_status, venue, court, timeslot, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
        timeslot_id:
          type: string
          format: uuid
        teamup_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        payment_status:
          type: string
          enum: [none, pending, succeeded, failed]
        timeslot:
          type: object
          required: [id, starts_at, ends_at, price_cents, currency]
          properties:
            id:
              type: string
              format: uuid
            starts_at:
              type: string
              format: date-time
            ends_at:
              type: string
              format: date-time
            price_cents:
              type: integer
              nullable: true
            currency:
              type: string
        court:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            sport_type:
              type: string
              nullable: true
        venue:
          type: object
          required: [id, name, address]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            address:
              type: string
            city:
              type: string
              nullable: true
        teamup:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            title:
              type: string
            description:
              type: string
              nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
