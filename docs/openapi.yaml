openapi: 3.0.3
info:
  title: Sports Meetup API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /auth/signup:
    post:
      tags: [Auth]
      summary: Sign up
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupIn'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '409':
          description: Email taken

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '401':
          description: Invalid credentials

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user info
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, email, display_name]
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  display_name:
                    type: string
                    nullable: true
        '401':
          description: Unauthorized
    patch:
      tags: [Auth]
      summary: Update current user info
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  nullable: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, email, display_name]
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  display_name:
                    type: string
                    nullable: true
        '401':
          description: Unauthorized

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '401':
          description: Invalid token

  /events:
    get:
      tags: [Events]
      summary: List events near a point
      operationId: getEventsPoint
      parameters:
        - in: query
          name: lat
          schema: { type: number }
        - in: query
          name: lng
          schema: { type: number }
        - in: query
          name: radius
          schema:
            type: number
            default: 5
            description: radius in km
        - in: query
          name: sport_type
          schema: { type: string }
        - in: query
          name: start_at
          schema: { type: string, format: date-time }
        - in: query
          name: end_at
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventOut'
        '400':
          description: lat_lng_required
    post:
      tags: [Events]
      summary: Create event
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateIn'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid

  /events/{id}/join:
    post:
      tags: [Events]
      summary: Join event
      operationId: joinEvent
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: [applicant_name, applicant_email]
              properties:
                applicant_name:
                  type: string
                applicant_email:
                  type: string
                  format: email
                applicant_phone:
                  type: string
                message:
                  type: string
      responses:
        '200':
          description: Joined or join request sent
        '400':
          description: Invalid input / Event full / Already joined
        '404':
          description: Event not found
        '403':
          description: Cannot join private event

  /events/{id}/leave:
    delete:
      tags: [Events]
      summary: Leave event
      operationId: leaveEvent
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: participant_id
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Left event
        '400':
          description: Not joined
        '404':
          description: Event not found

  /events/{id}:
    get:
      tags: [Events]
      summary: Get event details
      operationId: getEventById
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOut'
        '404':
          description: Event not found

  /events/all:
    get:
      tags: [Events]
      summary: Get all events (no filter)
      operationId: getAllEvents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventOut'

  /events/public:
    get:
      tags: [Events]
      summary: Get public events (可搜尋公開活動)
      operationId: getPublicEvents
      parameters:
        - in: query
          name: sport_type
          schema: { type: string }
        - in: query
          name: start_at
          schema: { type: string, format: date-time }
        - in: query
          name: end_at
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventOut'
  
  /events/token/{invite_token}:
    get:
      tags: [Events]
      summary: Get invite-only event by token (憑 token 讀取 invite-only 活動資訊)
      operationId: getInviteOnlyEvent
      parameters:
        - in: path
          name: invite_token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOut'
        '404':
          description: Event not found

  /events/{id}/participants:
    get:
      tags: [Events]
      summary: List event participants
      operationId: listEventParticipants
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, email, display_name]
                  properties:
                    id:
                      type: string
                      format: uuid
                    email:
                      type: string
                      format: email
                    display_name:
                      type: string
                      nullable: true
        '404':
          description: Event not found

  /events/owner/{id}/join-requests:
    get:
      tags: [Events]
      summary: List join requests for owned event
      operationId: listJoinRequests
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, user_id, event_id, status, created_at]
                  properties:
                    id:
                      type: string
                      format: uuid
                    user_id:
                      type: string
                      format: uuid
                    event_id:
                      type: string
                      format: uuid
                    status:
                      type: string
                      enum: [pending, approved, rejected]
                    created_at:
                      type: string
                      format: date-time
        '404':
          description: Event not found
        '403':
          description: Forbidden

  /events/owner/<uuid:req_id>/join-requests:
    post:
      tags: [Events]
      summary: Approve or reject a join request (Owner 審核 approve/reject)
      operationId: reviewJoinRequest
      parameters:
        - in: path
          name: req_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [approve, reject]
      responses:
        '200':
          description: OK
        '400':
          description: Invalid action
        '404':
          description: Request not found
        '403':
          description: Forbidden

  /venues/search:
    get:
      tags: [Venues]
      summary: Search available venues and timeslots (可搜尋公開活動)
      operationId: searchVenues
      parameters:
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: date
          schema: { type: string, format: date }
        - in: query
          name: sport_type
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [venue, timeslots]
                  properties:
                    venue:
                      type: object
                      required: [id, name, address, lat, lng]
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        address:
                          type: string
                        lat:
                          type: number
                        lng:
                          type: number
                    timeslots:
                      type: array
                      items:
                        type: object
                        required: [id, start_time, end_time, price, is_bookable]
                        properties:
                          id:
                            type: string
                            format: uuid
                          start_time:
                            type: string
                            format: date-time
                          end_time:
                            type: string
                            format: date-time
                          price:
                            type: number
                          is_bookable:
                            type: boolean
        '400':
          description: city_date_required

  /venues/bookings:
    post:
      tags: [Venues]
      summary: Book a venue timeslot
      operationId: bookVenueTimeslot
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timeslot_id]
              properties:
                timeslot_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Booking successful
          content:
            application/json:
              schema:
                type: object
                required: [id, status, payment_status]
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [confirmed, cancelled]
                  payment_status:
                    type: string
                    enum: [none, pending, succeeded]
        '400':
          description: Invalid timeslot_id / Timeslot not bookable
        '401':
          description: Unauthorized

  /bookings:
    get:
      tags: [Bookings]
      summary: List user's bookings
      operationId: listUserBookings
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema: 
            type: string
            enum: [pending, confirmed, cancelled]
        - in: query
          name: limit
          schema: 
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema: 
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingOut'
        '401':
          description: Unauthorized

  /bookings/{id}:
    get:
      tags: [Bookings]
      summary: Get booking details
      operationId: getBooking
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
        '404':
          description: Booking not found
        '403':
          description: Not the owner

  /bookings/{id}/assign:
    post:
      tags: [Bookings]
      summary: Assign booking to TeamUp or Event
      operationId: assignBooking
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingAssignmentIn'
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingAssignmentOut'
        '400':
          description: Invalid assignment / Already assigned
        '403':
          description: Not the owner
        '404':
          description: Booking or target not found

  /bookings/{id}/assignments:
    get:
      tags: [Bookings]
      summary: List booking assignments
      operationId: listBookingAssignments
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingAssignmentOut'
        '403':
          description: Not the owner
        '404':
          description: Booking not found

  /events/{id}/bookings:
    get:
      tags: [Events]
      summary: List event bookings
      operationId: listEventBookings
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingOut'
        '403':
          description: Not the owner
        '404':
          description: Event not found

  /events/{id}/teamups:
    get:
      tags: [Events]
      summary: List event teamups
      operationId: listEventTeamups
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventTeamUpOut'
        '403':
          description: Not the owner
        '404':
          description: Event not found

  /events/{id}/teamups:
    post:
      tags: [Events]
      summary: Add teamup to event
      operationId: addTeamupToEvent
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTeamUpIn'
      responses:
        '201':
          description: TeamUp added to event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTeamUpOut'
        '400':
          description: Invalid input / Already added
        '403':
          description: Not the owner
        '404':
          description: Event or TeamUp not found

  /teamups/{id}/events:
    get:
      tags: [TeamUps]
      summary: List teamup events
      operationId: listTeamupEvents
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventOut'
        '403':
          description: Not the owner
        '404':
          description: TeamUp not found

  /teamups:
    get:
      tags: [TeamUps]
      summary: List teamups with filters (all visibility)
      operationId: listTeamups
      parameters:
        - in: query
          name: sport_type
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: status
          schema:
            type: string
            enum: [open, closed, confirmed, cancelled]
            default: open
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamUpListItem'

  /teamups/public:
    get:
      tags: [TeamUps]
      summary: Get public teamups (可搜尋公開組團)
      operationId: getPublicTeamups
      parameters:
        - in: query
          name: sport_type
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: status
          schema:
            type: string
            enum: [open, closed, confirmed, cancelled]
            default: open
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamUpListItem'
    post:
      tags: [TeamUps]
      summary: Create a new teamup
      operationId: createTeamup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpCreateIn'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamUpCreateResponse'
        '400':
          description: Invalid input / TeamUp already exists for timeslot
        '401':
          description: Unauthorized
        '404':
          description: Court timeslot not found

  /teamups/{id}:
    get:
      tags: [TeamUps]
      summary: Get teamup details
      operationId: getTeamup
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamUpDetail'
        '404':
          description: TeamUp not found

  /teamups/token/{invite_token}:
    get:
      tags: [TeamUps]
      summary: Get invite-only teamup by token (憑 token 讀取 invite-only 組團資訊)
      operationId: getInviteOnlyTeamup
      parameters:
        - in: path
          name: invite_token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamUpDetail'
        '404':
          description: TeamUp not found

  /teamups/{id}/join:
    post:
      tags: [TeamUps]
      summary: Join a teamup
      operationId: joinTeamup
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpJoinRequest'
      responses:
        '201':
          description: Join request submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamUpJoinResponse'
        '400':
          description: TeamUp not open / Already applied / Already joined / TeamUp full
        '404':
          description: TeamUp not found

  /teamups/{id}/join-requests:
    get:
      tags: [TeamUps]
      summary: List join requests for a teamup (owner only)
      operationId: listTeamupJoinRequests
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamUpJoinRequestDetail'
        '403':
          description: Not the owner
        '404':
          description: TeamUp not found

  /teamups/{id}/join-requests/{request_id}/review:
    post:
      tags: [TeamUps]
      summary: Review a join request (owner only)
      operationId: reviewTeamupJoinRequest
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: request_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpReviewRequest'
      responses:
        '200':
          description: Review completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamUpReviewResponse'
        '400':
          description: Invalid action / Already reviewed / TeamUp full
        '403':
          description: Not the owner
        '404':
          description: TeamUp or request not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Tokens:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }

    SignupIn:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
        display_name: { type: string, nullable: true }

    LoginIn:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    EventCreateIn:
      type: object
      required: [booking_id, title, visibility]
      properties:
        booking_id:
          type: string
          format: uuid
        title:
          type: string
        visibility:
          type: string
          enum: [public, invite_only, private]
  
    EventOut:
      type: object
      required: [id, title, sport_type, starts_at, ends_at, capacity, status]
      properties:
        id: 
          type: string
          format: uuid
        title: 
          type: string
        description:
          type: string
          nullable: true
        sport_type: 
          type: string
          nullable: true
        starts_at: 
          type: string
          format: date-time
          nullable: true
        ends_at: 
          type: string
          format: date-time
          nullable: true
        city:
          type: string
          nullable: true
        capacity: 
          type: integer
          nullable: true
        owner_user_id:
          type: string
          format: uuid
          nullable: true
        visibility:
          type: string
          enum: [public, invite_only, private]
        invite_token:
          type: string
          nullable: true
        join_review_required:
          type: boolean
        status: 
          type: string
          enum: [open, closed, confirmed, cancelled]
        venue_location: 
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TeamUpCreateIn:
      type: object
      required: [court_timeslot_id, title, min_participants, max_participants]
