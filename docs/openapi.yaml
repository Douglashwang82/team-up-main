openapi: 3.0.3
info:
  title: TeamUp API
  description: |
    Sports venue booking and team formation API

    Features:
    - Venue search with geolocation
    - Timeslot booking
    - TeamUp creation and management
    - Join request workflow
  version: 1.0.0
  contact:
    name: TeamUp API Support
servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api.teamup.example.com
    description: Production server

tags:
  - name: Health
    description: Health check endpoints
  - name: Auth
    description: Authentication and user management
  - name: Venues
    description: Venue and timeslot search
  - name: Bookings
    description: Booking management
  - name: TeamUps
    description: TeamUp creation and management

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  # ============================================================================
  # AUTH ROUTES
  # ============================================================================
  /auth/signup:
    post:
      tags: [Auth]
      summary: Sign up new user
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupIn'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '409':
          description: Email already exists

  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '401':
          description: Invalid credentials

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user info
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '401':
          description: Unauthorized
  # ============================================================================
  # VENUE ROUTES
  # ============================================================================
  /venues:
    get:
      tags: [Venues]
      summary: Search venues with available time slots
      description: |
        Search venues based on location, datetime, and sport type.
        Supports geolocation-based search with distance filtering.
      operationId: searchVenues
      parameters:
        - name: lat
          in: query
          description: Latitude coordinate
          schema:
            type: number
            format: float
            example: 25.0330
        - name: lng
          in: query
          description: Longitude coordinate
          schema:
            type: number
            format: float
            example: 121.5654
        - name: distance
          in: query
          description: Search radius in meters (default 5000m)
          schema:
            type: number
            format: float
            default: 5000
            example: 5000
        - name: datetime
          in: query
          description: ISO datetime (YYYY-MM-DDTHH:MM:SS) or date (YYYY-MM-DD)
          schema:
            type: string
            example: "2025-10-20"
        - name: sport_type
          in: query
          description: Filter by sport type
          schema:
            type: string
            example: basketball
      responses:
        '200':
          description: List of venues with available time slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VenueSearchResult'

  /venues/{venue_id}:
    get:
      tags: [Venues]
      summary: Get venue details
      operationId: getVenueById
      parameters:
        - name: venue_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Venue details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueDetail'
        '404':
          description: Venue not found

  /venues/{venue_id}/courts/{court_id}/time_slots:
    get:
      tags: [Venues]
      summary: Get available time slots for a court
      operationId: getCourtTimeSlots
      parameters:
        - name: venue_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: court_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          description: Filter by date (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2025-10-20"
      responses:
        '200':
          description: List of available time slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeSlotOut'
        '404':
          description: Venue or court not found

  # ============================================================================
  # BOOKING ROUTES
  # ============================================================================
  /bookings:
    get:
      tags: [Bookings]
      summary: List user's bookings
      operationId: listBookings
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, cancelled]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingOut'
        '401':
          description: Unauthorized

    post:
      tags: [Bookings]
      summary: Create a new booking
      operationId: createBooking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateIn'
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingOut'
        '400':
          description: Invalid timeslot or already booked
        '401':
          description: Unauthorized
        '404':
          description: Timeslot not found

  /bookings/{booking_id}:
    get:
      tags: [Bookings]
      summary: Get booking details
      operationId: getBookingById
      security:
        - bearerAuth: []
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Booking details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetailOut'
        '403':
          description: Not the booking owner
        '404':
          description: Booking not found

    patch:
      tags: [Bookings]
      summary: Update booking status
      operationId: updateBooking
      security:
        - bearerAuth: []
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingUpdateIn'
      responses:
        '200':
          description: Booking updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingOut'
        '403':
          description: Not the booking owner
        '404':
          description: Booking not found

    delete:
      tags: [Bookings]
      summary: Cancel booking
      operationId: cancelBooking
      security:
        - bearerAuth: []
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Booking cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        '403':
          description: Not the booking owner
        '404':
          description: Booking not found

  # ============================================================================
  # EVENT ROUTES
  # ============================================================================
  /events:
    get:
      tags: [Events]
      summary: List and search Events
      description: |
        List Events with optional filtering and search.
        Supports filtering by status, visibility, and keyword search on title.
      operationId: listEvents
      parameters:
        - name: status
          in: query
          description: Filter by event status
          schema:
            type: string
            enum: [open, closed]
            default: open
        - name: visibility
          in: query
          description: Filter by visibility
          schema:
            type: string
            enum: [public, private]
        - name: keyword
          in: query
          description: Search keyword (searches in title)
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventOut'

    post:
      tags: [Events]
      summary: Create a new Event
      operationId: createEvent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateIn'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOut'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized

  /events/{event_id}:
    get:
      tags: [Events]
      summary: Get Event details
      operationId: getEventById
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetailOut'
        '404':
          description: Event not found

  /events/{event_id}/book:
    post:
      tags: [Events]
      summary: Book a timeslot for Event (owner only)
      description: Event owner can book multiple time slots for the team
      operationId: bookTimeslotForEvent
      security:
        - bearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBookTimeSlotIn'
      responses:
        '201':
          description: Timeslot booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBookingResponse'
        '400':
          description: Invalid timeslot or already booked
        '403':
          description: Not the Event owner
        '404':
          description: Event or timeslot not found

  /events/{event_id}/bookings:
    get:
      tags: [Events]
      summary: List all bookings for a Event
      operationId: listEventBookings
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of Event bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventBookingDetail'
        '404':
          description: Event not found

  /events/{event_id}/join:
    post:
      tags: [Events]
      summary: Submit join request to Event
      description: |
        Submit a join request to join a Event.
        Authenticated users auto-fill their info, non-authenticated users must provide details.
      operationId: joinEvent
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequestCreateIn'
      responses:
        '201':
          description: Join request submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestSubmitResponse'
        '400':
          description: Event not open / Already applied / Event full
        '404':
          description: Event not found

  /events/{event_id}/join-requests:
    get:
      tags: [Events]
      summary: List join requests (owner only)
      operationId: listJoinRequests
      security:
        - bearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of join requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JoinRequestOut'
        '403':
          description: Not the Event owner
        '404':
          description: Event not found

  /events/{event_id}/join-requests/{request_id}/review:
    post:
      tags: [Events]
      summary: Review join request (owner only)
      description: Approve or reject a join request
      operationId: reviewJoinRequest
      security:
        - bearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: request_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequestReviewIn'
      responses:
        '200':
          description: Review completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestReviewResponse'
        '400':
          description: Invalid action / Already reviewed / Event full
        '403':
          description: Not the Event owner
        '404':
          description: Event or request not found

  /events/my/created:
    get:
      tags: [Events]
      summary: Get events created by the authenticated user
      description: Returns all events owned by the authenticated user
      operationId: getMyCreatedEvents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of created events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventOut'
        '401':
          description: Unauthorized

  /events/my/joined:
    get:
      tags: [Events]
      summary: Get events joined by the authenticated user
      description: Returns all events where the authenticated user is a participant (member role)
      operationId: getMyJoinedEvents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of joined events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventOut'
        '401':
          description: Unauthorized

  /events/my/pending:
    get:
      tags: [Events]
      summary: Get events with pending join requests
      description: Returns all events where the authenticated user has submitted join requests
      operationId: getMyPendingEvents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of events with pending join requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventOut'
        '401':
          description: Unauthorized


  # ============================================================================
  # TICKET ROUTES
  # ============================================================================
  /tickets:
    post:
      tags: [Tickets]
      summary: Create a new ticket
      operationId: createTicket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreateIn'
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketOut'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized

    get:
      tags: [Tickets]
      summary: List user's tickets
      operationId: listTickets
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketOut'
        '401':
          description: Unauthorized

  /tickets/{ticket_id}:
    get:
      tags: [Tickets]
      summary: Get ticket details with matched events
      operationId: getTicket
      security:
        - bearerAuth: []
      parameters:
        - name: ticket_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ticket details with matched events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetailOut'
        '401':
          description: Unauthorized
        '403':
          description: Not the ticket owner
        '404':
          description: Ticket not found

  # ============================================================================
  # NOTIFICATION ROUTES
  # ============================================================================
  /notifications:
    get:
      tags: [Notifications]
      summary: List user's notifications
      operationId: listNotifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationOut'
        '401':
          description: Unauthorized

  /notifications/{notification_id}/read:
    post:
      tags: [Notifications]
      summary: Mark notification as read
      operationId: markNotificationAsRead
      security:
        - bearerAuth: []
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Notification not found
        '401':
          description: Unauthorized

# ==============================================================================
# COMPONENTS
# ==============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login/signup

  schemas:
    # ========================================================================
    # AUTH SCHEMAS
    # ========================================================================
    SignupIn:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 6
          example: password123
        display_name:
          type: string
          nullable: true
          example: John Doe

    LoginIn:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    TokenOut:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    UserOut:
      type: object
      required: [id, email, display_name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ========================================================================
    # VENUE SCHEMAS
    # ========================================================================
    VenueSearchResult:
      type: object
      required: [venue, time_slots]
      properties:
        venue:
          $ref: '#/components/schemas/VenueOut'
        time_slots:
          type: array
          items:
            $ref: '#/components/schemas/TimeSlotOut'

    VenueOut:
      type: object
      required: [id, name, address]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        city:
          type: string
          nullable: true
        latitude:
          type: number
          format: float
          nullable: true
        longitude:
          type: number
          format: float
          nullable: true
        distance_meters:
          type: number
          format: float
          nullable: true
          description: Distance from search coordinates (only when lat/lng provided)

    VenueDetail:
      type: object
      required: [id, name, address, courts, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        city:
          type: string
          nullable: true
        latitude:
          type: number
          format: float
          nullable: true
        longitude:
          type: number
          format: float
          nullable: true
        contact_phone:
          type: string
          nullable: true
        partner_code:
          type: string
          nullable: true
        courts:
          type: array
          items:
            $ref: '#/components/schemas/CourtOut'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CourtOut:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sport_type:
          type: string
          nullable: true

    TimeSlotOut:
      type: object
      required: [id, court_id, starts_at, ends_at, currency, is_bookable]
      properties:
        id:
          type: string
          format: uuid
        court_id:
          type: string
          format: uuid
        court_name:
          type: string
          nullable: true
          description: Only present in search results
        sport_type:
          type: string
          nullable: true
          description: Only present in search results
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        price_cents:
          type: integer
          nullable: true
        currency:
          type: string
          example: TWD
        is_bookable:
          type: boolean

    # ========================================================================
    # BOOKING SCHEMAS
    # ========================================================================
    BookingCreateIn:
      type: object
      required: [time_slot_id]
      properties:
        time_slot_id:
          type: string
          format: uuid
        teamup_id:
          type: string
          format: uuid
          nullable: true
          description: Optional TeamUp association

    BookingUpdateIn:
      type: object
      properties:
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        payment_status:
          type: string
          enum: [none, pending, succeeded, failed]

    BookingOut:
      type: object
      required: [id, owner_user_id, time_slot_id, status, payment_status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
        time_slot_id:
          type: string
          format: uuid
        teamup_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        payment_status:
          type: string
          enum: [none, pending, succeeded, failed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BookingDetailOut:
      type: object
      required: [id, owner_user_id, time_slot_id, status, payment_status, time_slot, court, venue, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
        time_slot_id:
          type: string
          format: uuid
        teamup_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        payment_status:
          type: string
          enum: [none, pending, succeeded, failed]
        time_slot:
          $ref: '#/components/schemas/TimeSlotOut'
        court:
          $ref: '#/components/schemas/CourtOut'
        venue:
          $ref: '#/components/schemas/VenueOut'
        event:
          $ref: '#/components/schemas/EventOut'
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ========================================================================
    # TEAMUP SCHEMAS
    # ========================================================================
    EventCreateIn:
      type: object
      required: [title, max_participants]
      properties:
        title:
          type: string
          example: Weekend Basketball Game
        description:
          type: string
          nullable: true
          example: Looking for players for a friendly game
        max_participants:
          type: integer
          minimum: 1
          example: 10
        visibility:
          type: string
          enum: [public, private]
          default: public
