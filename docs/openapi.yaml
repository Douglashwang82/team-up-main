  # ==============================================================================
  # CHAT ROUTES
  # ==============================================================================
  /chat/messages:
    get:
      tags: [Chat]
      summary: List chat messages
      operationId: listMessages
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Number of messages to return
        - name: cursor
          in: query
          schema:
            type: string
          description: UUID of the message to paginate before
      responses:
        '200':
          description: List of chat messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessageOut'
        '401':
          description: Unauthorized
    post:
      tags: [Chat]
      summary: Send a chat message
      operationId: postMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageIn'
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageOut'
        '401':
          description: Unauthorized
        '422':
          description: Validation Error
    delete:
      tags: [Chat]
      summary: Clear chat history
      operationId: clearMessages
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Chat history cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Unauthorized

# ==============================================================================
# COMPONENTS
# ==============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login/signup

  schemas:
    # ========================================================================
    # CHAT SCHEMAS
    # ========================================================================
    ChatMessageIn:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        widget:
          type: object
          nullable: true
          additionalProperties: true

    ChatMessageOut:
      type: object
      required:
        - id
        - user_id
        - role
        - content
        - created_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        widget:
          type: object
          nullable: true
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    # ========================================================================
    # AUTH SCHEMAS
    # ========================================================================
    SignupIn:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 6
          example: password123
        display_name:
          type: string
          nullable: true
          example: John Doe

    LoginIn:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    TokenOut:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    UserOut:
      type: object
      required: [id, email, display_name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        preferred_sports:
          type: array
          items:
            type: string
          nullable: true
        skill_levels:
          type: object
          additionalProperties:
            type: string
          nullable: true
        preferred_time_slots:
          type: array
          items:
            type: string
          nullable: true
        preferred_language:
          type: string
          nullable: true
        custom_preferences:
          type: string
          nullable: true

    # ========================================================================
    # VENUE SCHEMAS
    # ========================================================================
    VenueCreateIn:
      type: object
      required: [name, address]
      properties:
        name:
          type: string
        address:
          type: string
        city:
          type: string
          nullable: true
        latitude:
          type: number
          format: float
          nullable: true
        longitude:
          type: number
          format: float
          nullable: true
        contact_phone:
          type: string
          nullable: true
        partner_code:
          type: string
          nullable: true

    VenueUpdateIn:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        city:
          type: string
          nullable: true
        latitude:
          type: number
          format: float
          nullable: true
        longitude:
          type: number
          format: float
          nullable: true
        contact_phone:
          type: string
          nullable: true
        partner_code:
          type: string
          nullable: true

    VenueSearchResult:
      type: object
      required: [venue, time_slots]
      properties:
        venue:
          $ref: '#/components/schemas/VenueOut'
        time_slots:
          type: array
          items:
            $ref: '#/components/schemas/TimeSlotOut'

    VenueOut:
      type: object
      required: [id, name, address]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        city:
          type: string
          nullable: true
        latitude:
          type: number
          format: float
          nullable: true
        longitude:
          type: number
          format: float
          nullable: true
        distance_meters:
          type: number
          format: float
          nullable: true
          description: Distance from search coordinates (only when lat/lng provided)

    VenueDetail:
      type: object
      required: [id, name, address, courts, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        city:
          type: string
          nullable: true
        latitude:
          type: number
          format: float
          nullable: true
        longitude:
          type: number
          format: float
          nullable: true
        contact_phone:
          type: string
          nullable: true
        partner_code:
          type: string
          nullable: true
        courts:
          type: array
          items:
            $ref: '#/components/schemas/CourtOut'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CourtUpdateIn:
      type: object
      properties:
        name:
          type: string
        sport_type:
          type: string
          nullable: true

    CourtOut:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sport_type:
          type: string
          nullable: true

    TimeSlotCreateIn:
      type: object
      required: [starts_at, ends_at, is_bookable]
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        price_cents:
          type: integer
          nullable: true
        currency:
          type: string
          example: TWD
        is_bookable:
          type: boolean

    TimeSlotUpdateIn:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        price_cents:
          type: integer
          nullable: true
        currency:
          type: string
        is_bookable:
          type: boolean

    TimeSlotOut:
      type: object
      required: [id, court_id, starts_at, ends_at, currency, is_bookable]
      properties:
        id:
          type: string
          format: uuid
        court_id:
          type: string
          format: uuid
        court_name:
          type: string
          nullable: true
          description: Only present in search results
        sport_type:
          type: string
          nullable: true
          description: Only present in search results
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        price_cents:
          type: integer
          nullable: true
        currency:
          type: string
          example: TWD
        is_bookable:
          type: boolean

    # ========================================================================
    # BOOKING SCHEMAS
    # ========================================================================
    BookingCreateIn:
      type: object
      required: [time_slot_id]
      properties:
        time_slot_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
          nullable: true
          description: Optional TeamUp association

    BookingUpdateIn:
      type: object
      properties:
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        payment_status:
          type: string
          enum: [none, pending, succeeded, failed]

    BookingOut:
      type: object
      required: [id, owner_user_id, time_slot_id, status, payment_status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
        time_slot_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        payment_status:
          type: string
          enum: [none, pending, succeeded, failed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BookingDetailOut:
      type: object
      required: [id, owner_user_id, time_slot_id, status, payment_status, time_slot, court, venue, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
        time_slot_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        payment_status:
          type: string
          enum: [none, pending, succeeded, failed]
        time_slot:
          $ref: '#/components/schemas/TimeSlotOut'
        court:
          $ref: '#/components/schemas/CourtOut'
        venue:
          $ref: '#/components/schemas/VenueOut'
        event:
          $ref: '#/components/schemas/EventOut'
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ========================================================================
    # TEAMUP SCHEMAS
    # ========================================================================
    EventCreateIn:
      type: object
      required: [title, max_participants]
      properties:
        title:
          type: string
          example: Weekend Basketball Game
        description:
          type: string
          nullable: true
          example: Looking for players for a friendly game
        max_participants:
          type: integer
          minimum: 1
          example: 10
        venue_id:
          type: string
          format: uuid
          nullable: true
          description: Optional Venue association
        court_id:
          type: string
          format: uuid
          nullable: true
          description: Optional Court association
        visibility:
          type: string
          enum: [public, private]
          default: public
        duration_type:
          type: string
          enum: [temporary, permanent]
          default: temporary
        status:
          type: string
          enum: [open, closed]
          default: open

    EventUpdateIn:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        max_participants:
          type: integer
          minimum: 1
        visibility:
          type: string
          enum: [public, private]
        duration_type:
          type: string
          enum: [temporary, permanent]
        status:
          type: string
          enum: [open, closed]

    OwnerOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true

    EventOut:
      type: object
      required: [id, title, status, max_participants, current_participants, visibility, duration_type, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        image:
          type: string
          nullable: true
          description: URL or path to event image
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, closed]
        max_participants:
          type: integer
        current_participants:
          type: integer
        owner:
          $ref: '#/components/schemas/OwnerOut'
        visibility:
          type: string
          enum: [public, private]
        duration_type:
          type: string
          enum: [temporary, permanent]
        created_at:
          type: string
          format: date-time
        participants:
          type: array
          items:
            $ref: '#/components/schemas/EventParticipantOut'
          nullable: true
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/EventBookingDetail'
          nullable: true
        user_join_status:
          type: string
          enum: [none, pending, joined]

    EventDetailOut:
      type: object
      required: [id, title, status, max_participants, current_participants, owner_user_id, visibility, duration_type, participants, bookings, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        image:
          type: string
          nullable: true
          description: URL or path to event image
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, closed]
        max_participants:
          type: integer
        current_participants:
          type: integer
        owner_user_id:
          type: string
          format: uuid
        visibility:
          type: string
          enum: [public, private]
        duration_type:
          type: string
          enum: [temporary, permanent]
        participants:
          type: array
          items:
            $ref: '#/components/schemas/EventParticipantOut'
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/EventBookingDetail'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        user_join_status:
          type: string
          enum: [none, pending, joined]

    EventParticipantOut:
      type: object
      required: [id, user_id, display_name, email, phone, role, joined_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [owner, member]
        avatar_url:
          type: string
          nullable: true
        joined_at:
          type: string
          format: date-time

    EventBookTimeSlotIn:
      type: object
      required: [time_slot_id]
      properties:
        time_slot_id:
          type: string
          format: uuid

    EventBookingResponse:
      type: object
