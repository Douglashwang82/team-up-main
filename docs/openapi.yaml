    # ========================================================================
    # TICKET SCHEMAS
    # ========================================================================
    TicketCreateIn:
      type: object
      required: [date, start_time, duration_minutes, sport_type, intensity]
      properties:
        date:
          type: string
          format: date
          example: "2025-11-20"
        start_time:
          type: string
          example: "18:00"
        duration_minutes:
          type: integer
          example: 120
        sport_type:
          type: string
          example: basketball
        intensity:
          type: string
          enum: [Low, Medium, High]
          example: Medium
        venue_ids:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
        price_min:
          type: integer
          nullable: true
        price_max:
          type: integer
          nullable: true
        currency:
          type: string
          default: USD

    TicketOut:
      type: object
      required: [id, date, start_time, sport_type, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        start_time:
          type: string
        sport_type:
          type: string
        intensity:
          type: string
        status:
          type: string
          enum: [open, matched, expired]
        created_at:
          type: string
          format: date-time
        message:
          type: string
          nullable: true

    # ========================================================================
    # NOTIFICATION SCHEMAS
    # ========================================================================
    NotificationOut:
      type: object
      required: [id, message, type, is_read, created_at]
      properties:
        id:
          type: string
          format: uuid
        message:
          type: string
        type:
          type: string
        is_read:
          type: boolean
        related_entity_id:
          type: string
          format: uuid
          nullable: true
        related_entity_type:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
