      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        time_slot_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        payment_status:
          type: string
          enum: [none, pending, succeeded, failed]
        created_at:
          type: string
          format: date-time

    EventBookingDetail:
