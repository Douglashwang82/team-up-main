services:
  db:
    image: postgis/postgis:16-3.4
    container_name: teamup-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: team_up
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/api/docker-initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d team_up" ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: teamup-api
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/team_up
      JWT_SECRET: change_me
      BOOTSTRAP_DB: "1"
      FLASK_RUN_PORT: "8080"
      FLASK_DEBUG: "1"
    ports:
      - "8080:8080"
    volumes:
      - .:/app
volumes:
  pgdata:
