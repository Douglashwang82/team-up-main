version: "3.9"
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sports-postgis
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sportsmeet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: sports-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/sportsmeet
      JWT_SECRET: change_me
      BOOTSTRAP_DB: "1"
      FLASK_RUN_PORT: "8080"
    ports:
      - "8080:8080"
